                        )}
                    </div>
                </div>
            );
        };

        // --- MODULE: MEMORY MATCH ---
        const MemoryMatch = ({ onBack }) => {
            const ICONS = ['Sun', 'Moon', 'Star', 'Heart', 'Cloud', 'Music', 'Coffee', 'Bird'];
            const [cards, setCards] = useState([]);
            const [flipped, setFlipped] = useState([]);
            const [matched, setMatched] = useState(new Set());
            const [moves, setMoves] = useState(0);
            const [bestMoves, setBestMoves] = useState(null);
            const [isLocked, setIsLocked] = useState(false);
            const [won, setWon] = useState(false);

            useEffect(() => { dbHelper.getLeastMoves('memorymatch').then(setBestMoves); startNewGame(); }, []);

            const startNewGame = () => {
                const timestamp = Date.now();
                const shuffled = [...ICONS, ...ICONS].sort(() => Math.random() - 0.5).map((icon, id) => ({ id: `${id}-${timestamp}`, icon }));
                setCards(shuffled); setFlipped([]); setMatched(new Set()); setMoves(0); setWon(false); setIsLocked(false);
            };

            const handleCardClick = (index) => {
                if (isLocked || flipped.includes(index) || matched.has(index)) return;
                const newFlipped = [...flipped, index]; setFlipped(newFlipped);

                if (newFlipped.length === 2) {
                    setIsLocked(true); setMoves(m => m + 1);
                    const [first, second] = newFlipped;
                    if (cards[first].icon === cards[second].icon) {
                        setMatched(prev => {
                            const next = new Set(prev).add(first).add(second);
                            if (next.size === cards.length) {
                                setWon(true);
                                if (bestMoves === null || moves + 1 < bestMoves) { setBestMoves(moves + 1); dbHelper.saveLeastMoves('memorymatch', moves + 1); }
                            }
                            return next;
                        });
                        setFlipped([]); setIsLocked(false);
                    } else { setTimeout(() => { setFlipped([]); setIsLocked(false); }, 1500); }
                }
            };

            return (
                <div className="min-h-screen flex flex-col max-w-lg mx-auto w-full pb-8 select-none touch-none">
                    <TopBar title="Memory Match" onBack={onBack} moves={moves} bestMoves={bestMoves} />
                    <div className="text-center px-4 mb-6"><h2 className="text-xl font-bold text-gray-800">Find the Pairs</h2><p className="text-sm text-gray-500 mt-1">Tap two cards to reveal them. Match all pairs in the fewest moves.</p></div>
                    <div className="flex-1 flex flex-col items-center justify-start px-4">
                        <div className="grid grid-cols-4 gap-3 sm:gap-4 max-w-[340px] w-full bg-blue-50 p-4 rounded-xl shadow-inner border border-blue-100">
                            {cards.map((card, i) => {
                                const isFlipped = flipped.includes(i); const isMatched = matched.has(i); const isVisible = isFlipped || isMatched;
                                return (
                                    <div key={card.id} onClick={() => handleCardClick(i)} className="aspect-square rounded-xl cursor-pointer relative">
                                        <div className={`absolute inset-0 bg-indigo-500 hover:bg-indigo-600 rounded-xl flex items-center justify-center shadow-sm transition-opacity duration-300 z-10 ${isVisible ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}><Icon name="Brain" size={28} className="text-indigo-300 opacity-50" /></div>
                                        <div className={`absolute inset-0 bg-white rounded-xl flex items-center justify-center border-2 shadow-sm transition-opacity duration-300 z-0 ${isVisible ? 'opacity-100 border-blue-400' : 'opacity-0 border-transparent'} ${isMatched ? 'border-green-400 bg-green-50 opacity-60' : ''}`}><Icon name={card.icon} size={36} className={isMatched ? 'text-green-500' : 'text-blue-600'} /></div>
                                    </div>
                                );
                            })}
                        </div>
                        {won && <div className="text-center animate-pulse mt-8"><h2 className="text-3xl font-black text-blue-600 mb-6">Excellent Memory!</h2><Button onClick={startNewGame} variant="primary" className="mx-auto">Play Again</Button></div>}
                    </div>
                </div>
            );
        };

        // --- MODULE: PATIENCE (SOLITAIRE) ---
        const Patience = ({ onBack }) => {
            const [deck, setDeck] = useState([]);
            const [waste, setWaste] = useState([]);
            const [foundations, setFoundations] = useState([[], [], [], []]);
            const [tableau, setTableau] = useState([[], [], [], [], [], [], []]);
            
            const [selected, setSelected] = useState(null);
            const [moves, setMoves] = useState(0);
            const [bestMoves, setBestMoves] = useState(null);
            const [won, setWon] = useState(false);

            useEffect(() => { dbHelper.getLeastMoves('patience').then(setBestMoves); startNewGame(); }, []);

            const startNewGame = () => {
                let newDeck = []; let idCounter = 0;
                for (let suit = 0; suit < 4; suit++) { for (let rank = 1; rank <= 13; rank++) newDeck.push({ id: idCounter++, rank, suit, hidden: true }); }
                for (let i = newDeck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [newDeck[i], newDeck[j]] = [newDeck[j], newDeck[i]]; }
                let newTableau = [[], [], [], [], [], [], []];
                for (let col = 0; col < 7; col++) {
                    for (let row = 0; row <= col; row++) { let card = newDeck.pop(); if (row === col) card.hidden = false; newTableau[col].push(card); }
                }
                setTableau(newTableau); setDeck(newDeck); setWaste([]); setFoundations([[], [], [], []]); setSelected(null); setMoves(0); setWon(false);
            };

            const isOppositeColor = (suit1, suit2) => { const isRed1 = suit1 === 0 || suit1 === 1; const isRed2 = suit2 === 0 || suit2 === 1; return isRed1 !== isRed2; };

            const handleDeckClick = () => {
                if (won) return; setSelected(null);
                let newDeck = [...deck]; let newWaste = [...waste];
                if (newDeck.length > 0) { let card = newDeck.pop(); card.hidden = false; newWaste.push(card); } 
                else if (newWaste.length > 0) { newDeck = newWaste.reverse().map(c => ({ ...c, hidden: true })); newWaste = []; }
                setDeck(newDeck); setWaste(newWaste); setMoves(m => m + 1);
            };

            const handleSlotClick = (zone, colIndex, rowIndex) => {
                if (won) return;
                if (!selected) {
                    let card = null;
                    if (zone === 'waste' && waste.length > 0) card = waste[waste.length - 1];
                    else if (zone === 'foundation' && foundations[colIndex].length > 0) card = foundations[colIndex][foundations[colIndex].length - 1];
                    else if (zone === 'tableau' && tableau[colIndex].length > 0 && rowIndex !== -1) {
                        card = tableau[colIndex][rowIndex]; if (card.hidden) return;
                    }
                    if (card) setSelected({ zone, col: colIndex, row: rowIndex !== -1 ? rowIndex : 0 });
                    return;
                }

                if (selected.zone === zone && selected.col === colIndex && selected.row === rowIndex) { setSelected(null); return; }

                let sourceCard = null; let movingStack = [];
                if (selected.zone === 'waste') { sourceCard = waste[waste.length - 1]; movingStack = [sourceCard]; } 
                else if (selected.zone === 'foundation') { sourceCard = foundations[selected.col][foundations[selected.col].length - 1]; movingStack = [sourceCard]; } 
                else if (selected.zone === 'tableau') { sourceCard = tableau[selected.col][selected.row]; movingStack = tableau[selected.col].slice(selected.row); }

                let isValid = false;
                if (zone === 'foundation' && movingStack.length === 1) {
                    const topFoundation = foundations[colIndex].length > 0 ? foundations[colIndex][foundations[colIndex].length - 1] : null;
                    if (!topFoundation && sourceCard.rank === 1) isValid = true;
                    else if (topFoundation && topFoundation.suit === sourceCard.suit && topFoundation.rank + 1 === sourceCard.rank) isValid = true;
                } else if (zone === 'tableau') {
                    const topTableau = tableau[colIndex].length > 0 ? tableau[colIndex][tableau[colIndex].length - 1] : null;
                    if (!topTableau && sourceCard.rank === 13) isValid = true;
                    else if (topTableau && !topTableau.hidden && topTableau.rank - 1 === sourceCard.rank && isOppositeColor(topTableau.suit, sourceCard.suit)) isValid = true;
                }

                if (isValid) {
                    let newWaste = [...waste]; let newFoundations = foundations.map(arr => [...arr]); let newTableau = tableau.map(arr => [...arr]);
                    if (selected.zone === 'waste') newWaste.pop();
                    else if (selected.zone === 'foundation') newFoundations[selected.col].pop();
                    else if (selected.zone === 'tableau') {
                        newTableau[selected.col] = newTableau[selected.col].slice(0, selected.row);
                        if (newTableau[selected.col].length > 0) newTableau[selected.col][newTableau[selected.col].length - 1].hidden = false;
                    }
                    if (zone === 'foundation') newFoundations[colIndex].push(sourceCard); else if (zone === 'tableau') newTableau[colIndex].push(...movingStack);

                    setWaste(newWaste); setFoundations(newFoundations); setTableau(newTableau); setSelected(null); setMoves(m => m + 1);
                    if (newFoundations.every(f => f.length === 13)) {
                        setWon(true);
                        if (bestMoves === null || moves + 1 < bestMoves) { setBestMoves(moves + 1); dbHelper.saveLeastMoves('patience', moves + 1); }
                    }
                } else {
                    if (zone === 'tableau' && tableau[colIndex].length > 0 && !tableau[colIndex][rowIndex]?.hidden) setSelected({ zone, col: colIndex, row: rowIndex });
                    else setSelected(null);
                }
            };

            const CardView = ({ card, isSelected, onClick, className = "" }) => {
                if (!card) return <div onClick={onClick} className={`w-10 sm:w-16 md:w-20 aspect-[2/3] rounded-md border-2 border-white/20 bg-black/20 cursor-pointer ${className}`}></div>;
                if (card.hidden) return <div onClick={onClick} className={`w-10 sm:w-16 md:w-20 aspect-[2/3] rounded-md bg-indigo-700 border border-white shadow-sm flex items-center justify-center cursor-pointer ${className}`}><div className="w-8 h-12 sm:w-12 sm:h-20 bg-indigo-800 rounded opacity-40 border border-indigo-500 flex items-center justify-center"><Icon name="Layers" size={24} className="text-white opacity-20" /></div></div>;
                const suits = { 0: '♥', 1: '♦', 2: '♣', 3: '♠' }; const colors = { 0: 'text-rose-600', 1: 'text-rose-600', 2: 'text-gray-900', 3: 'text-gray-900' }; const ranks = { 1: 'A', 11: 'J', 12: 'Q', 13: 'K' };
                const displayRank = ranks[card.rank] || card.rank; const colorClass = colors[card.suit];
                return (
                    <div onClick={onClick} className={`w-10 sm:w-16 md:w-20 aspect-[2/3] rounded-md bg-white border border-gray-300 shadow flex flex-col justify-between p-1 sm:p-2 cursor-pointer transition-all duration-200 ${isSelected ? 'ring-4 ring-amber-400 z-50 scale-105 shadow-2xl -translate-y-2' : 'hover:shadow-md'} ${className}`}>
                        <div className={`text-[10px] sm:text-sm md:text-lg font-black ${colorClass} leading-none`}>{displayRank}</div>
                        <div className={`text-lg sm:text-2xl md:text-4xl text-center ${colorClass}`}>{suits[card.suit]}</div>
                        <div className={`text-[10px] sm:text-sm md:text-lg font-black ${colorClass} leading-none text-right rotate-180`}>{displayRank}</div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col max-w-4xl mx-auto w-full pb-8 select-none touch-none">
                    <TopBar title="Patience" onBack={onBack} moves={moves} bestMoves={bestMoves} />
                    <div className="flex-1 px-2 sm:px-4 flex flex-col">
                        <div className="flex justify-between items-center mb-2 px-2">
                            <p className="text-sm text-gray-600 font-medium hidden sm:block">Tap a card to select it, then tap its destination.</p>
                            <button onClick={startNewGame} className="text-sm font-bold text-indigo-600 hover:text-indigo-800 flex items-center gap-1 ml-auto"><Icon name="RefreshCw" size={16} /> Restart</button>
                        </div>
                        <div className="bg-emerald-800 flex-1 rounded-2xl shadow-inner border-4 border-emerald-900 p-3 sm:p-6 overflow-hidden flex flex-col gap-6 relative">
                            {won && <div className="absolute inset-0 z-50 bg-black/40 flex items-center justify-center rounded-xl backdrop-blur-sm"><div className="bg-white p-8 rounded-2xl text-center shadow-2xl tile-pop max-w-sm"><h2 className="text-3xl font-black text-emerald-600 mb-2">You Won!</h2><p className="text-gray-600 mb-6 font-medium">Completed in {moves} moves.</p><Button onClick={startNewGame} variant="success" className="mx-auto w-full">Play Again</Button></div></div>}
                            <div className="flex justify-between gap-1 sm:gap-2">
                                <div className="flex gap-1 sm:gap-2 w-1/2">
                                    <div className="relative">
                                        {deck.length > 0 ? <CardView card={{hidden: true}} onClick={handleDeckClick} /> : <div onClick={handleDeckClick} className="w-10 sm:w-16 md:w-20 aspect-[2/3] rounded-md border-2 border-emerald-700 bg-emerald-900/50 flex items-center justify-center cursor-pointer hover:bg-emerald-700/50 transition-colors"><Icon name="RefreshCw" size={24} className="text-emerald-500 opacity-50" /></div>}
                                        {deck.length > 0 && <div className="absolute -bottom-2 -right-2 bg-emerald-900 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">{deck.length}</div>}
                                    </div>
                                    <div className="relative flex">
                                        {waste.length === 0 ? <CardView card={null} /> : waste.slice(-3).map((card, idx, arr) => {
                                            const isTop = idx === arr.length - 1; const isSelected = selected?.zone === 'waste' && isTop;
                                            return <div key={card.id} className={`relative ${idx > 0 ? "-ml-6 sm:-ml-10 md:-ml-12" : ""}`} style={{ zIndex: idx }}><CardView card={card} isSelected={isSelected} onClick={() => isTop ? handleSlotClick('waste', 0, 0) : null} /></div>
                                        })}
                                    </div>
                                </div>
                                <div className="flex gap-1 sm:gap-2 w-1/2 justify-end">
                                    {foundations.map((foundation, colIdx) => {
                                        const topCard = foundation.length > 0 ? foundation[foundation.length - 1] : null; const isSelected = selected?.zone === 'foundation' && selected?.col === colIdx;
                                        const foundationSuits = ['♥', '♦', '♣', '♠']; const fColor = colIdx < 2 ? 'text-rose-900/30' : 'text-gray-900/30';
                                        return (
                                            <div key={`found-${colIdx}`} className="relative">
                                                {topCard ? <CardView card={topCard} isSelected={isSelected} onClick={() => handleSlotClick('foundation', colIdx, foundation.length - 1)} /> : <div onClick={() => handleSlotClick('foundation', colIdx, -1)} className="w-10 sm:w-16 md:w-20 aspect-[2/3] rounded-md border-2 border-emerald-700 bg-emerald-900/30 flex items-center justify-center cursor-pointer hover:bg-emerald-800/50"><span className={`text-2xl sm:text-4xl ${fColor}`}>{foundationSuits[colIdx]}</span></div>}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                            <div className="flex justify-between gap-1 sm:gap-2 flex-1 mt-4">
                                {tableau.map((column, colIdx) => (
                                    <div key={`tab-${colIdx}`} className="flex flex-col flex-1 relative min-h-[150px]">
                                        {column.length === 0 ? <CardView card={null} onClick={() => handleSlotClick('tableau', colIdx, -1)} className="mx-auto relative z-10" /> : column.map((card, rowIdx) => {
                                            const isSelected = selected?.zone === 'tableau' && selected?.col === colIdx && rowIdx >= selected?.row;
                                            return <div key={card.id} className={`relative mx-auto ${rowIdx > 0 ? (card.hidden ? "-mt-[4.5rem] sm:-mt-[5rem] md:-mt-[5.5rem]" : "-mt-[4.5rem] sm:-mt-[4.5rem] md:-mt-[4.5rem]") : ""}`} style={{ zIndex: rowIdx + 10 }}><CardView card={card} isSelected={isSelected} onClick={() => handleSlotClick('tableau', colIdx, rowIdx)} /></div>
                                        })}
                                        <div className="absolute inset-0 z-0" onClick={() => handleSlotClick('tableau', colIdx, column.length > 0 ? column.length - 1 : -1)}></div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MODULE: TARGET SUM ---
        const TargetSum = ({ onBack }) => {
            const COLS = 6;
            const ROWS = 6;
            const GAME_TIME = 120; // 2 minutes
            
            const [grid, setGrid] = useState([]);
            const [target, setTarget] = useState(0);
            const [selected, setSelected] = useState([]);
            const [score, setScore] = useState(0);
            const [highScore, setHighScore] = useState(0);
            const [timeLeft, setTimeLeft] = useState(GAME_TIME);
            const [isPlaying, setIsPlaying] = useState(false);
            const [errorFlash, setErrorFlash] = useState(false);

            useEffect(() => {
                dbHelper.getHighScore('targetsum').then(setHighScore);
                startNewGame();
            }, []);

            useEffect(() => {
                let timer;
                if (isPlaying && timeLeft > 0) {
                    timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                } else if (timeLeft === 0 && isPlaying) {
                    setIsPlaying(false);
                    dbHelper.saveScore('targetsum', score);
                }
                return () => clearInterval(timer);
            }, [isPlaying, timeLeft, score]);

            const generateNewTarget = () => {
                // Random target between 10 and 22
                setTarget(Math.floor(Math.random() * 13) + 10);
            };

            const startNewGame = () => {
                let newGrid = [];
                for(let r=0; r<ROWS; r++){
                    let row = [];
                    for(let c=0; c<COLS; c++) {
                        row.push({ id: `${r}-${c}-${Date.now()}`, val: Math.floor(Math.random() * 9) + 1 });
                    }
                    newGrid.push(row);
                }
                setGrid(newGrid);
                setSelected([]);
                setScore(0);
                setTimeLeft(GAME_TIME);
                setIsPlaying(true);
                generateNewTarget();
            };

            const handleTileClick = (r, c) => {
                if (!isPlaying) return;
                
                const existingIdx = selected.findIndex(p => p.r === r && p.c === c);
                let newSelected;
                
                if (existingIdx !== -1) {
                    // Deselect
                    newSelected = selected.filter((_, i) => i !== existingIdx);
                } else {
                    // Select
                    newSelected = [...selected, {r, c}];
                }
                
                setSelected(newSelected);
                checkSum(newSelected);
            };

            const checkSum = (currentSelection) => {
                const currentSum = currentSelection.reduce((sum, p) => sum + grid[p.r][p.c].val, 0);
                
                if (currentSum === target) {
                    // Match!
                    setScore(prev => prev + (currentSelection.length * 10));
                    
                    // Apply Gravity
                    let newGrid = JSON.parse(JSON.stringify(grid));
                    currentSelection.forEach(p => { newGrid[p.r][p.c] = null; });
                    
                    for (let c = 0; c < COLS; c++) {
                        let emptySpaces = 0;
                        for (let r = ROWS - 1; r >= 0; r--) {
                            if (newGrid[r][c] === null) emptySpaces++;
                            else if (emptySpaces > 0) {
                                newGrid[r + emptySpaces][c] = newGrid[r][c];
                                newGrid[r][c] = null;
                            }
                        }
                        // Fill top
                        for (let r = 0; r < emptySpaces; r++) {
                            newGrid[r][c] = { id: `new-${c}-${r}-${Date.now()}`, val: Math.floor(Math.random() * 9) + 1 };
                        }
                    }
                    
                    setGrid(newGrid);
                    setSelected([]);
                    generateNewTarget();
                    
                } else if (currentSum > target) {
                    // Over the limit
                    setErrorFlash(true);
                    setTimeout(() => setErrorFlash(false), 300);
                    setSelected([]);
                }
            };

            const isTileSelected = (r, c) => selected.some(p => p.r === r && p.c === c);
            const currentSum = selected.reduce((sum, p) => sum + grid[p.r][p.c].val, 0);

            return (
                <div className="min-h-screen flex flex-col max-w-lg mx-auto w-full pb-8 select-none touch-none">
                    <TopBar title="Target Sum" onBack={onBack} score={score} highScore={highScore} time={timeLeft} />
                    
                    <div className="px-4 mb-4 flex justify-between gap-4">
                        <div className="flex-1 bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center">
                            <div className="text-sm text-gray-500 font-bold uppercase tracking-wider mb-1">Target</div>
                            <div className="text-4xl font-black text-indigo-700">{target}</div>
                        </div>
                        <div className={`flex-1 p-4 rounded-2xl shadow-inner border text-center transition-colors duration-200 ${errorFlash ? 'bg-rose-100 border-rose-300' : 'bg-indigo-50 border-indigo-100'}`}>
                            <div className="text-sm text-indigo-400 font-bold uppercase tracking-wider mb-1">Current Sum</div>
                            <div className={`text-4xl font-black ${errorFlash ? 'text-rose-600' : 'text-indigo-600'}`}>{currentSum}</div>
                        </div>
                    </div>

                    {!isPlaying && timeLeft === 0 ? (
                        <div className="flex-1 flex flex-col items-center justify-center p-6 text-center animate-pulse">
                            <h2 className="text-3xl font-black text-indigo-600 mb-2">Time's Up!</h2>
                            <p className="text-gray-600 mb-6 font-medium">You scored {score} points.</p>
                            <Button onClick={startNewGame} variant="primary">Play Again</Button>
                        </div>
                    ) : (
                        <div className="flex-1 flex flex-col items-center justify-start px-4">
                            <div className="grid gap-2 bg-indigo-900 p-3 rounded-2xl w-full max-w-[360px]" style={{ gridTemplateColumns: `repeat(${COLS}, minmax(0, 1fr))` }}>
                                {grid.map((row, r) => (
                                    row.map((cell, c) => {
                                        const selected = isTileSelected(r, c);
                                        return (
                                            <div 
                                                key={cell.id}
                                                onClick={() => handleTileClick(r, c)}
                                                className={`aspect-square flex items-center justify-center text-2xl sm:text-3xl font-black rounded-xl cursor-pointer no-tap-highlight transition-all duration-200 shadow-sm
                                                    ${selected ? 'bg-amber-400 text-white transform scale-95 shadow-inner' : 'bg-white text-indigo-900 hover:bg-indigo-50 hover:scale-105'}`}
                                            >
                                                {cell.val}
                                            </div>
                                        )
                                    })
                                ))}
                            </div>
                            <p className="text-sm text-gray-500 font-medium mt-6 text-center">Tap numbers that add up perfectly to the target.</p>
                        </div>
                    )}
                </div>
            );
        };

        // --- MODULE: PATTERN RECALL ---
        const PatternRecall = ({ onBack }) => {
            const COLORS = [
                'bg-rose-500', 'bg-blue-500', 'bg-green-500', 
                'bg-amber-400', 'bg-purple-500', 'bg-orange-500', 
                'bg-pink-500', 'bg-teal-500', 'bg-indigo-500'
            ];
            
            const [sequence, setSequence] = useState([]);
            const [playerStep, setPlayerStep] = useState(0);
            const [activeTile, setActiveTile] = useState(null);
            const [isShowingSequence, setIsShowingSequence] = useState(false);
            const [gameState, setGameState] = useState('idle'); // 'idle', 'playing', 'gameover'
            const [score, setScore] = useState(0);
            const [highScore, setHighScore] = useState(0);

            const isMounted = useRef(true);

            useEffect(() => {
                dbHelper.getHighScore('patternrecall').then(setHighScore);
                // Removed auto-start to wait for user interaction
                return () => { isMounted.current = false; };
            }, []);

            const handleStart = () => {
                setSequence([Math.floor(Math.random() * 9)]);
                setPlayerStep(0);
                setScore(0);
                setGameState('playing');
                setIsShowingSequence(true);
            };

            const playSequence = async () => {
                setIsShowingSequence(true);
                await new Promise(r => setTimeout(r, 600)); // Pause before starting
                
                for (let i = 0; i < sequence.length; i++) {
                    if (!isMounted.current) return;
                    setActiveTile(sequence[i]);
                    await new Promise(r => setTimeout(r, 500)); // Show duration
                    if (!isMounted.current) return;
                    setActiveTile(null);
                    await new Promise(r => setTimeout(r, 200)); // Gap between flashes
                }
                
                if (isMounted.current) setIsShowingSequence(false);
            };

            // Trigger playback when sequence changes and isShowingSequence is true
            useEffect(() => {
                if (isShowingSequence && gameState === 'playing') {
                    playSequence();
                }
            }, [sequence, isShowingSequence, gameState]);

            const handleTileClick = (index) => {
                if (isShowingSequence || gameState !== 'playing') return;

                if (index === sequence[playerStep]) {
                    // Correct tap
                    if (playerStep === sequence.length - 1) {
                        // Completed the round
                        const newScore = sequence.length;
                        setScore(newScore);
                        if (newScore > highScore) {
                            setHighScore(newScore);
                            dbHelper.saveScore('patternrecall', newScore);
                        }
                        
                        setPlayerStep(0);
                        setTimeout(() => {
                            setSequence(prev => [...prev, Math.floor(Math.random() * 9)]);
                            setIsShowingSequence(true);
                        }, 500);
                    } else {
                        // Move to next step in current round
                        setPlayerStep(prev => prev + 1);
                    }
                } else {
                    // Incorrect tap
                    setGameState('gameover');
                }
            };

            return (
                <div className="min-h-screen flex flex-col max-w-lg mx-auto w-full pb-8 select-none touch-none">
                    <TopBar title="Pattern Recall" onBack={onBack} score={score} highScore={highScore} />
                    
                    <div className="text-center px-4 mb-8">
                        {gameState === 'idle' ? (
                            <div>
                                <h2 className="text-2xl font-black text-indigo-600 mb-4">Ready to test your memory?</h2>
                                <Button onClick={handleStart} variant="primary" className="mx-auto">Start Game</Button>
                            </div>
                        ) : gameState === 'gameover' ? (
                            <div className="animate-pulse">
                                <h2 className="text-2xl font-black text-rose-600">Incorrect Sequence!</h2>
                                <p className="text-gray-600 font-medium">You remembered {score} steps.</p>
                            </div>
                        ) : isShowingSequence ? (
                            <div>
                                <h2 className="text-2xl font-black text-indigo-600">Watch closely...</h2>
                                <p className="text-gray-500 font-medium">Memorize the pattern.</p>
                            </div>
                        ) : (
                            <div>
                                <h2 className="text-2xl font-black text-teal-600">Your turn!</h2>
                                <p className="text-gray-500 font-medium">Repeat the sequence.</p>
                            </div>
                        )}
                    </div>

                    <div className="flex-1 flex flex-col items-center justify-start px-4">
                        <div className="grid grid-cols-3 gap-3 sm:gap-4 max-w-[340px] w-full bg-gray-100 p-4 rounded-2xl shadow-inner border border-gray-200">
                            {Array(9).fill(null).map((_, i) => {
                                const isActive = activeTile === i;
                                const isUserTurn = !isShowingSequence && gameState === 'playing';
                                
                                return (
                                    <div 
                                        key={i}
                                        onPointerDown={(e) => {
                                            if (isUserTurn) handleTileClick(i);
                                        }}
                                        className={`aspect-square rounded-xl shadow-md transition-all duration-150 cursor-pointer ${COLORS[i]} 
                                            ${isActive 
                                                ? 'ring-4 ring-white ring-offset-2 scale-110 brightness-150 opacity-100 z-10 shadow-xl' 
                                                : 'opacity-75'
                                            }
                                            ${isUserTurn ? 'active:scale-90 active:brightness-75 hover:opacity-90' : ''}
                                        `}
                                    ></div>
                                );
                            })}
                        </div>

                        {gameState === 'gameover' && (
                            <div className="mt-10">
                                <Button onClick={handleStart} variant="primary">Try Again</Button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- MODULE: ABOUT ---
        const About = ({ onBack }) => {
            return (
                <div className="min-h-screen flex flex-col max-w-lg mx-auto w-full pb-8">
                    <TopBar title="About" onBack={onBack} />
                    <div className="px-4 mt-2">
                        <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                            <p className="text-lg text-gray-800 font-medium mb-8 leading-relaxed">
                                This was an application designed by <span className="font-bold text-indigo-700">Jim Liddle</span> to help his parents keep cognitively fit.
                            </p>
                            
                            <h2 className="text-xl font-black text-indigo-900 mb-6">The app was designed with 8 specific exercises:</h2>
                            
                            <div className="space-y-6">
                                <div className="flex gap-4">
                                    <div className="mt-1 text-emerald-600"><Icon name="Calculator" size={28} /></div>
                                    <div>
                                        <h3 className="font-bold text-gray-900 text-lg">Target Sum</h3>
                                        <p className="text-sm text-gray-600 mt-1 leading-relaxed">Engages the parietal lobe through basic arithmetic and quantitative reasoning, improving numerical fluency and mental flexibility.</p>
                                    </div>
                                </div>

                                <div className="flex gap-4">
                                    <div className="mt-1 text-purple-600"><Icon name="ActivitySquare" size={28} /></div>
                                    <div>
                                        <h3 className="font-bold text-gray-900 text-lg">Pattern Recall</h3>
                                        <p className="text-sm text-gray-600 mt-1 leading-relaxed">Directly trains visuospatial temporal memory, forcing the brain to encode and recall sequences in specific physical locations over time.</p>
                                    </div>
                                </div>

                                <div className="flex gap-4">
                                    <div className="mt-1 text-teal-600"><Icon name="BrainCircuit" size={28} /></div>
                                    <div>
                                        <h3 className="font-bold text-gray-900 text-lg">Wordle</h3>
                                        <p className="text-sm text-gray-600 mt-1 leading-relaxed">Enhances deductive reasoning and working memory as you logically eliminate letters to deduce the hidden word.</p>
                                    </div>
                                </div>
                                
                                <div className="flex gap-4">
                                    <div className="mt-1 text-indigo-600"><Icon name="Search" size={28} /></div>
                                    <div>
                                        <h3 className="font-bold text-gray-900 text-lg">Word Search</h3>
                                        <p className="text-sm text-gray-600 mt-1 leading-relaxed">Improves visual scanning, pattern recognition, and sustained attention by training the brain to filter out visual noise.</p>
                                    </div>
                                </div>
                                
                                <div className="flex gap-4">
                                    <div className="mt-1 text-rose-600"><Icon name="Blocks" size={28} /></div>
                                    <div>
                                        <h3 className="font-bold text-gray-900 text-lg">Word Tower</h3>
                                        <p className="text-sm text-gray-600 mt-1 leading-relaxed">Exercises lexical access and strategic planning, challenging you to construct words while managing spatial constraints.</p>
                                    </div>
                                </div>
                                
                                <div className="flex gap-4">
                                    <div className="mt-1 text-amber-600"><Icon name="Puzzle" size={28} /></div>
                                    <div>
                                        <h3 className="font-bold text-gray-900 text-lg">Mystery Jigsaw</h3>
                                        <p className="text-sm text-gray-600 mt-1 leading-relaxed">Boosts visual-spatial processing and problem-solving skills by requiring the mind to rotate and match complex visual fragments.</p>
                                    </div>
                                </div>
                                
                                <div className="flex gap-4">
                                    <div className="mt-1 text-blue-600"><Icon name="LayoutGrid" size={28} /></div>
                                    <div>
                                        <h3 className="font-bold text-gray-900 text-lg">Memory Match</h3>
                                        <p className="text-sm text-gray-600 mt-1 leading-relaxed">Directly targets short-term object-location encoding and retrieval, along with sustained concentration and visual recognition.</p>
                                    </div>
                                </div>

                                <div className="flex gap-4">
                                    <div className="mt-1 text-emerald-800"><Icon name="Layers" size={28} /></div>
                                    <div>
                                        <h3 className="font-bold text-gray-900 text-lg">Patience</h3>
                                        <p className="text-sm text-gray-600 mt-1 leading-relaxed">Challenges executive function, working memory, and strategic planning by requiring multi-step problem solving and sequencing.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 5. MAIN MENU & APP ROUTING
        // ==========================================
        const GAMES = [
            { id: 'targetsum', name: 'Target Sum', desc: 'Find numbers that add up to the target.', icon: 'Calculator', color: 'bg-emerald-100 text-emerald-800', type: 'score' },
            { id: 'patternrecall', name: 'Pattern Recall', desc: 'Memorize and repeat the flashing sequence.', icon: 'ActivitySquare', color: 'bg-purple-100 text-purple-800', type: 'score' },
            { id: 'wordle', name: 'Wordle', desc: 'Guess the 5-letter word in 6 tries.', icon: 'BrainCircuit', color: 'bg-teal-100 text-teal-800', type: 'score' },
            { id: 'wordsearch', name: 'Word Search', desc: 'Find hidden words in the grid.', icon: 'Search', color: 'bg-indigo-100 text-indigo-800', type: 'score' },
            { id: 'wordtower', name: 'Word Tower', desc: 'Connect adjacent letters to clear blocks.', icon: 'Blocks', color: 'bg-rose-100 text-rose-800', type: 'score' },
            { id: 'jigsaw', name: 'Mystery Jigsaw', desc: 'Piece together a beautiful random scene.', icon: 'Puzzle', color: 'bg-amber-100 text-amber-800', type: 'time' },
            { id: 'memorymatch', name: 'Memory Match', desc: 'Find the matching pairs with fewest moves.', icon: 'LayoutGrid', color: 'bg-blue-100 text-blue-800', type: 'moves' },
            { id: 'patience', name: 'Patience', desc: 'Classic Klondike solitaire card game.', icon: 'Layers', color: 'bg-emerald-200 text-emerald-900', type: 'moves' },
        ];

        const MainMenu = ({ onSelectGame }) => {
            const [scores, setScores] = useState({});
            const [showResetConfirm, setShowResetConfirm] = useState(false);
            
            const [deferredPrompt, setDeferredPrompt] = useState(null);
            const [isInstalled, setIsInstalled] = useState(false);
            const [showInstallInstructions, setShowInstallInstructions] = useState(false);

            const loadScores = async () => {
                let s = {};
                for (let g of GAMES) {
                    if (g.type === 'score') s[g.id] = await dbHelper.getHighScore(g.id);
                    else if (g.type === 'time') { const bt = await dbHelper.getBestTime(g.id); s[g.id] = bt !== null ? formatTime(bt) : '-'; }
                    else if (g.type === 'moves') { const bm = await dbHelper.getLeastMoves(g.id); s[g.id] = bm !== null ? `${bm} moves` : '-'; }
                }
                setScores(s);
            };

            useEffect(() => {
                loadScores();
                if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) setIsInstalled(true);
                const handleBeforeInstallPrompt = (e) => { e.preventDefault(); setDeferredPrompt(e); };
                const handleAppInstalled = () => { setIsInstalled(true); setDeferredPrompt(null); };
                window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt); window.addEventListener('appinstalled', handleAppInstalled);
                return () => { window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt); window.removeEventListener('appinstalled', handleAppInstalled); };
            }, []);

            const handleReset = async () => { await dbHelper.clearAllData(); await loadScores(); setShowResetConfirm(false); };

            const handleInstallClick = async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt(); const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') setIsInstalled(true); setDeferredPrompt(null);
                } else { setShowInstallInstructions(true); }
            };

            const getInstallInstructions = () => {
                const ua = navigator.userAgent.toLowerCase();
                if (/iphone|ipad|ipod/.test(ua)) return { title: "Install on iPhone / iPad", text: "Tap the Share icon at the bottom or top of your screen, then scroll down and tap 'Add to Home Screen'.", icon: "Share" };
                if (/android/.test(ua) && /chrome|chromium|crios/.test(ua)) return { title: "Install on Android", text: "Tap the Menu icon (⋮) at the top right of your browser, then tap 'Add to Home screen'.", icon: "MoreVertical" };
                return { title: "Install App", text: "Look for an 'Install' icon in your browser's address bar, or check your browser menu for an 'Add to Home screen' option.", icon: "Download" };
            };

            return (
                <div className="min-h-screen flex flex-col max-w-lg mx-auto p-6 pt-12">
                    <div className="text-center mb-10">
                        <div className="inline-flex items-center justify-center w-20 h-20 rounded-full bg-indigo-600 text-white shadow-lg mb-4"><Icon name="Activity" size={40} /></div>
                        <h1 className="text-4xl font-extrabold text-gray-900 tracking-tight">Cognitive Agility</h1>
                        <p className="text-lg text-gray-600 mt-2">Daily exercises to keep your mind sharp.</p>
                    </div>

                    <div className="flex flex-col gap-4">
                        {GAMES.map(game => (
                            <div key={game.id} onClick={() => onSelectGame(game.id)} className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 hover:shadow-md transition-shadow cursor-pointer flex items-center gap-4 active:scale-95 transition-transform">
                                <div className={`w-16 h-16 rounded-xl flex items-center justify-center ${game.color}`}><Icon name={game.icon} size={32} /></div>
                                <div className="flex-1"><h2 className="text-xl font-bold text-gray-900">{game.name}</h2><p className="text-sm text-gray-500 mt-1">{game.desc}</p></div>
                                <div className="text-right"><div className="text-xs text-gray-400 font-bold uppercase tracking-wider">Best</div><div className="text-lg font-black text-indigo-600">{scores[game.id] || 0}</div></div>
                            </div>
                        ))}
                    </div>
                    
                    <div className="mt-auto pt-8 flex flex-col items-center gap-4">
                        <div className="flex flex-wrap justify-center gap-3">
                            <button onClick={() => onSelectGame('about')} className="text-sm font-bold text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-4 py-2 rounded-lg transition-colors flex items-center gap-2"><Icon name="Info" size={16} /> About</button>
                            {!isInstalled && <button onClick={handleInstallClick} className="text-sm font-bold text-teal-600 hover:text-teal-800 bg-teal-50 hover:bg-teal-100 px-4 py-2 rounded-lg transition-colors flex items-center gap-2"><Icon name="Download" size={16} /> Install App</button>}
                            <button onClick={() => setShowResetConfirm(true)} className="text-sm font-bold text-rose-500 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 px-4 py-2 rounded-lg transition-colors flex items-center gap-2"><Icon name="Trash2" size={16} /> Reset</button>
                        </div>
                        <div className="text-center text-sm text-gray-400 font-medium">Designed for mental fitness & cognitive agility.</div>
                    </div>

                    {showResetConfirm && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl tile-pop">
                                <Icon name="AlertTriangle" size={48} className="mx-auto text-rose-500 mb-4" />
                                <h3 className="text-2xl font-black text-gray-900 mb-2">Reset Progress?</h3>
                                <p className="text-gray-600 mb-6 font-medium">This will permanently delete all your high scores and clear your played puzzle history. This cannot be undone.</p>
                                <div className="flex gap-3 justify-center"><Button variant="outline" onClick={() => setShowResetConfirm(false)} className="flex-1">Cancel</Button><Button variant="danger" onClick={handleReset} className="flex-1">Reset</Button></div>
                            </div>
                        </div>
                    )}
                    {showInstallInstructions && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl tile-pop">
                                <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-teal-100 text-teal-600 mb-4"><Icon name={getInstallInstructions().icon} size={32} /></div>
                                <h3 className="text-2xl font-black text-gray-900 mb-2">{getInstallInstructions().title}</h3>
                                <p className="text-gray-600 mb-6 font-medium leading-relaxed">{getInstallInstructions().text}</p>
                                <Button variant="primary" onClick={() => setShowInstallInstructions(false)} className="w-full">Got it</Button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [currentView, setCurrentView] = useState('menu');
            const [dbReady, setDbReady] = useState(false);
            const [isOffline, setIsOffline] = useState(false);

            useEffect(() => {
                dbHelper.init().then(() => {
                    fetch('https://raw.githubusercontent.com/redbo/scrabble/master/dictionary.txt')
                        .then(res => { if (!res.ok) throw new Error("Network response failed"); return res.text(); })
                        .then(text => {
                            text.split('\n').forEach(w => { const clean = w.trim().toLowerCase(); if (clean.length >= 3) VALIDATION_DICTIONARY.add(clean); });
                            setDbReady(true);
                        })
                        .catch(e => { console.error("Failed to load dictionary:", e); setIsOffline(true); });
                }).catch(e => { console.error("Database initialization failed:", e); setIsOffline(true); });
            }, []);

            if (isOffline) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
                        <div className="bg-white p-8 rounded-2xl shadow-lg border border-rose-100 max-w-sm w-full">
                            <Icon name="WifiOff" size={48} className="mx-auto text-rose-500 mb-4" />
                            <h2 className="text-2xl font-black text-gray-900 mb-2">Are you online?</h2>
                            <p className="text-gray-600 mb-6 font-medium">Unable to load module data. Please go online and refresh the app.</p>
                            <Button onClick={() => window.location.reload()} variant="primary" className="mx-auto w-full">Refresh App</Button>
                        </div>
                    </div>
                );
            }

            if (!dbReady) return <div className="min-h-screen flex items-center justify-center text-indigo-600 font-bold text-xl animate-pulse">Loading modules...</div>;

            return (
                <div>
                    {currentView === 'menu' && <MainMenu onSelectGame={setCurrentView} />}
                    {currentView === 'about' && <About onBack={() => setCurrentView('menu')} />}
                    {currentView === 'targetsum' && <TargetSum onBack={() => setCurrentView('menu')} />}
                    {currentView === 'patternrecall' && <PatternRecall onBack={() => setCurrentView('menu')} />}
                    {currentView === 'wordle' && <Wordle onBack={() => setCurrentView('menu')} />}
                    {currentView === 'wordsearch' && <WordSearch onBack={() => setCurrentView('menu')} />}
                    {currentView === 'wordtower' && <WordTower onBack={() => setCurrentView('menu')} />}
                    {currentView === 'jigsaw' && <JigsawPuzzle onBack={() => setCurrentView('menu')} />}
                    {currentView === 'memorymatch' && <MemoryMatch onBack={() => setCurrentView('menu')} />}
                    {currentView === 'patience' && <Patience onBack={() => setCurrentView('menu')} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
