                            <button 
                                onClick={() => setShowResetConfirm(true)} 
                                className="text-sm font-bold text-rose-500 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 px-4 py-2 rounded-lg transition-colors flex items-center gap-2"
                            >
                                <Icon name="Trash2" size={16} /> Reset
                            </button>
                        </div>
                        <div className="text-center text-sm text-gray-400 font-medium">
                            Designed for mental fitness & cognitive agility.
                        </div>
                    </div>

                    {/* Reset Confirmation Modal */}
                    {showResetConfirm && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl tile-pop">
                                <Icon name="AlertTriangle" size={48} className="mx-auto text-rose-500 mb-4" />
                                <h3 className="text-2xl font-black text-gray-900 mb-2">Reset Progress?</h3>
                                <p className="text-gray-600 mb-6 font-medium">This will permanently delete all your high scores and clear your played puzzle history. This cannot be undone.</p>
                                <div className="flex gap-3 justify-center">
                                    <Button variant="outline" onClick={() => setShowResetConfirm(false)} className="flex-1">Cancel</Button>
                                    <Button variant="danger" onClick={handleReset} className="flex-1">Reset</Button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* PWA Install Instructions Modal */}
                    {showInstallInstructions && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl tile-pop">
                                <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-teal-100 text-teal-600 mb-4">
                                    <Icon name={getInstallInstructions().icon} size={32} />
                                </div>
                                <h3 className="text-2xl font-black text-gray-900 mb-2">{getInstallInstructions().title}</h3>
                                <p className="text-gray-600 mb-6 font-medium leading-relaxed">{getInstallInstructions().text}</p>
                                <Button variant="primary" onClick={() => setShowInstallInstructions(false)} className="w-full">Got it</Button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [currentView, setCurrentView] = useState('menu');
            const [dbReady, setDbReady] = useState(false);
            const [isOffline, setIsOffline] = useState(false);

            useEffect(() => {
                dbHelper.init().then(() => {
                    // Asynchronously load a massive 170k+ word Scrabble dictionary for extensive validation support
                    fetch('https://raw.githubusercontent.com/redbo/scrabble/master/dictionary.txt')
                        .then(res => {
                            if (!res.ok) throw new Error("Network response failed");
                            return res.text();
                        })
                        .then(text => {
                            text.split('\n').forEach(w => {
                                const clean = w.trim().toLowerCase();
                                if (clean.length >= 3) VALIDATION_DICTIONARY.add(clean);
                            });
                            setDbReady(true);
                        })
                        .catch(e => {
                            console.error("Failed to load dictionary:", e);
                            setIsOffline(true);
                        });
                        
                }).catch(e => {
                    console.error("Database initialization failed:", e);
                    setIsOffline(true);
                });
            }, []);

            if (isOffline) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
                        <div className="bg-white p-8 rounded-2xl shadow-lg border border-rose-100 max-w-sm w-full">
                            <Icon name="WifiOff" size={48} className="mx-auto text-rose-500 mb-4" />
                            <h2 className="text-2xl font-black text-gray-900 mb-2">Are you online?</h2>
                            <p className="text-gray-600 mb-6 font-medium">Unable to load module data. Please go online and refresh the app.</p>
                            <Button onClick={() => window.location.reload()} variant="primary" className="mx-auto w-full">
                                Refresh App
                            </Button>
                        </div>
                    </div>
                );
            }

            if (!dbReady) {
                return <div className="min-h-screen flex items-center justify-center text-indigo-600 font-bold text-xl animate-pulse">Loading modules...</div>;
            }

            return (
                <div>
                    {currentView === 'menu' && <MainMenu onSelectGame={setCurrentView} />}
                    {currentView === 'about' && <About onBack={() => setCurrentView('menu')} />}
                    {currentView === 'wordle' && <Wordle onBack={() => setCurrentView('menu')} />}
                    {currentView === 'wordsearch' && <WordSearch onBack={() => setCurrentView('menu')} />}
                    {currentView === 'wordtower' && <WordTower onBack={() => setCurrentView('menu')} />}
                    {currentView === 'jigsaw' && <JigsawPuzzle onBack={() => setCurrentView('menu')} />}
                    {currentView === 'memorymatch' && <MemoryMatch onBack={() => setCurrentView('menu')} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
