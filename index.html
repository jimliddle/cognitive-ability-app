    <script>
        (function() {
            const manifest = {
                name: "Cognitive Agility Suite",
                short_name: "CogAgility",
                start_url: window.location.href.split('?')[0],
                display: "standalone",
                background_color: "#f0fdfa",
                theme_color: "#4f46e5",
                icons: [{
                    src: "data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%234f46e5' rx='112'/%3E%3Cpath d='M256 128a128 128 0 10128 128 128 128 0 00-128-128zm0 216a88 88 0 1188-88 88 88 0 01-88 88z' fill='%23fff'/%3E%3C/svg%3E",
                    sizes: "512x512",
                    type: "image/svg+xml",
                    purpose: "any maskable"

                    src: "data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' fill='%234f46e5' rx='42'/%3E%3Cpath d='M96 48a48 48 0 1048 48 48 48 0 00-48-48zm0 81a33 33 0 1133-33 33 33 0 01-33 33z' fill='%23fff'/%3E%3C/svg%3E",
                    sizes: "192x192",
                    type: "image/svg+xml",
                    purpose: "any maskable"
                }]
            };
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
            document.head.appendChild(link);
        })();
    </script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0fdfa; /* Light teal background */
            overscroll-behavior: none;
            user-select: none; /* Prevent text selection during gameplay */
        }
        
        .no-tap-highlight {
            -webkit-tap-highlight-color: transparent;
        }

        /* Animation for tiles */
        .tile-pop {
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }

</head>
<body>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo, useRef } = React;

        // ==========================================

        const DICTIONARY_STRING = "apple alive adult about actor acute admit adopt adapt abuse alert alien alike allow alone along alter amaze angel anger angle angry apart apple apply arena argue arise armed armor array arrow asset audio audit avoid award aware badly baker bases basic basis beach beast begin belly below bench bingo birth black blame blind block blood board brain brand bread break brick bring broad brown brush build bunch buyer cabin cable camel catch cause chain chair chest chief child chill claim class clean clear click clock close coach coast count cover cream cross crowd crown curve cycle daily dance dawns delay depth digit dirty doing doubt dozen draft drain dream dress drill drink drive eager early earth eight elite empty enemy enjoy enter entry equal error event exact exist extra faded false fault fiber field fifth fifty fight final first fixed flame flash fleet floor fluid focus force frame frank front fruit fully funny giant glass globe going grace grand grant grass great green gross group guard guess guest guide habit happy heart heavy hello horse hotel house human ideal image index inner input issue joint judge juice labor large laser later laugh layer learn lease least leave legal level light limit lipid liver local logic loose lower lucky magic major maker match mayor meant metal might minor model money month moral motor mount mouse mouth movie music naked newly night noise north novel nurse occur ocean offer often order other ought paint panel paper party peace phase phone photo piece pilot pitch place plain plane plant plate point pound power press price pride prime print prior prize proof proud prove queen quick quiet quite radio raise range rapid ratio reach ready refer relax right river roman rough round royal rural scale scene scope score sense serve seven shape share sharp sheep sheet shift shirt shock short sight skill sleep small smart smile smith smoke solid solve sound south space speak speed spend split spoke sport staff stage stand start state steam steel stick still stock stone store storm story strip style sugar suite super sweet table taste teach theme thick thing think third those three throw tiger tight title toast today topic total touch tower track trade train treat trend trial trust truth uncle under union unity upset value video visit voice vowel waste watch water wheel where which white whole whose woman women words world worry worst would wound write wrong yield young youth active agility brain memory puzzle logic smart clever puzzle search words tower letter blocks logic puzzle search spell doe does dog dogs cat cats bat bats hat hats mat mats rat rats sat pat pats fat fats vat vats eat eats tea teas pea peas sea seas see sees bee bees fee fees tee tees toe toes hoe hoes roe roes woe woes ear ears era eras are area areas arm arms art arts ark arks ant ants and any all ask ass ate ave awe awl awn axe bad bag bah bam ban bap bar bas bat bay bed beg bel ben bet bey bib bid big bin bit boa bob bog boo bop bow box boy bub bud bug bum bun bus but buy bye cab cad cam can cap car caw cay cob cod cog con coo cop cot cow cox coy coz cry cub cud cue cup cur cut dab dad dam dap daw day deb dee def del den dew dex did die dig dim din dip doc doe dog don dot dry dub dud due dug dun duo dye ear eat ebb eel egg ego eke elf elk elm emo emu end eng eon era erg err eta eve eye fab fad fag fan far fas fat fax fay fed fee fen fex fey fez fib fig fin fir fit fix fly fob foe fog foh fon fop for fox foy fro fry fub pug pub pun pup pur put pya pye pyx tab tag tam tap tar tas tat tau tav taw tax tea ted tee teg tel ten tet tew the thy tic tie tig tin tip tit toe tog tom ton too top tor tot tow toy try tub tug tui tun tup tut tux twa two tye udo ugh uke ump uns upo ups urb urn use uta vac van vat vau vav vaw vet vex via vie vig vim vis vow vox vug wab wad wae wag wan wap war was wat waw wax way web wed wee wen wet wha who why wig win wis wit wiz woe won woo wos wot wow wry wud wye wyn yag yak yam yap yar yaw yay yea yeh yen yep yes yet yew yin yip yob yod yon you yow yuk yum yup zag zap zas zax zea zed zee zek zig zin zip zit zoa zoo abs ace act add ado ads aft age ago aid ail aim air alb ale all alp alt amp amu ana and ane ant any ape app apt arc are arm art ash ask asp ass ate ave avo awe awl awn axe aye ays azo bad bag bah bal bam ban bap bar bas bat bay bed beg bel ben bet bey bib bid big bin bio bis bit biz boa bob bog boo bop bow box boy bra bub bud bug bum bun bur bus but buy bye cab cad cam can cap car caw cay cee cel cep chi cob cod cog con coo cop cor cos cot cow cox coy coz cru cry cub cud cue cup cur cut dab dad dag dah dak dal dam dan dap daw day deb dee def del den dev dew dex dey dib did die dig dim din dip dis dit doc doe dog dol dom don dor dos dot dry dub dud due dug dun duo dye ear eat eau ebb ecu edh eel eff efs egg ego eke eld elf elk ell elm els eme emf emu end eng ens eon era ere erg ern err ers ess eta eth eve ewe eye fab fad fag fan far fas fat fax fay fed fee feg feh fem fen fer fes fet feu fex fey fez fib fid fie fig fil fin fir fit fix fly fob foe fog foh fon fop for fou fox foy fro fry fub fud pug pub pun pup pur put pya pye pyx";
        
        const ALL_WORDS = Array.from(new Set(DICTIONARY_STRING.toLowerCase().split(' ').filter(w => w.length >= 3)));
        const WORDS_5_LETTER = ALL_WORDS.filter(w => w.length === 5);
        
        const VALIDATION_DICTIONARY = new Set(ALL_WORDS);

        // ==========================================
        // 2. INDEXED DB HELPER
        // ==========================================
        const DB_NAME = 'CognitiveAgilityDB';
        const DB_VERSION = 1;

        const dbHelper = {
            db: null,
            init: function() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(DB_NAME, DB_VERSION);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('scores')) db.createObjectStore('scores', { keyPath: 'gameId' });
                        if (!db.objectStoreNames.contains('state')) db.createObjectStore('state', { keyPath: 'key' });
                    };
                    req.onsuccess = (e) => { this.db = e.target.result; resolve(this.db); };
                    req.onerror = (e) => reject(e.target.error);
                });
            },
            saveScore: function(gameId, score) {
                if (!this.db) return Promise.resolve();
                return new Promise((resolve) => {
                    const tx = this.db.transaction('scores', 'readwrite');
                    const store = tx.objectStore('scores');
                    const req = store.get(gameId);
                    req.onsuccess = () => {
                        const existing = req.result;
                        if (!existing || score > existing.highScore) store.put({ gameId, highScore: score });
                        resolve();
                    };
                });
            },
            getHighScore: function(gameId) {
                if (!this.db) return Promise.resolve(0);
                return new Promise((resolve) => {
                    const tx = this.db.transaction('scores', 'readonly');
                    const store = tx.objectStore('scores');
                    const req = store.get(gameId);
                    req.onsuccess = () => resolve(req.result ? req.result.highScore : 0);
                    req.onerror = () => resolve(0);
                });
            },
            saveTime: function(gameId, time) {
                if (!this.db) return Promise.resolve();
                return new Promise((resolve) => {
                    const tx = this.db.transaction('scores', 'readwrite');
                    const store = tx.objectStore('scores');
                    const req = store.get(gameId);
                    req.onsuccess = () => {
                        const existing = req.result || { gameId };
                        if (!existing.bestTime || time < existing.bestTime) { existing.bestTime = time; store.put(existing); }
                        resolve();
                    };
                });
            },
            getBestTime: function(gameId) {
                if (!this.db) return Promise.resolve(null);
                return new Promise((resolve) => {
                    const tx = this.db.transaction('scores', 'readonly');
                    const store = tx.objectStore('scores');
                    const req = store.get(gameId);
                    req.onsuccess = () => resolve(req.result && req.result.bestTime ? req.result.bestTime : null);
                    req.onerror = () => resolve(null);
                });
            },
            saveLeastMoves: function(gameId, moves) {
                if (!this.db) return Promise.resolve();
                return new Promise((resolve) => {
                    const tx = this.db.transaction('scores', 'readwrite');
                    const store = tx.objectStore('scores');
                    const req = store.get(gameId);
                    req.onsuccess = () => {
                        const existing = req.result || { gameId };
                        if (!existing.bestMoves || moves < existing.bestMoves) { existing.bestMoves = moves; store.put(existing); }
                        resolve();
                    };
                });
            },
            getLeastMoves: function(gameId) {
                if (!this.db) return Promise.resolve(null);
                return new Promise((resolve) => {
                    const tx = this.db.transaction('scores', 'readonly');
                    const store = tx.objectStore('scores');
                    const req = store.get(gameId);
                    req.onsuccess = () => resolve(req.result && req.result.bestMoves ? req.result.bestMoves : null);
                    req.onerror = () => resolve(null);
                });
            },
            getUsedWords: function(gameId) {
                if (!this.db) return Promise.resolve([]);
                return new Promise((resolve) => {
                    const tx = this.db.transaction('state', 'readonly');
                    const store = tx.objectStore('state');
                    const req = store.get(`${gameId}_used`);
                    req.onsuccess = () => resolve(req.result ? req.result.words : []);
                    req.onerror = () => resolve([]);
                });
            },
            addUsedWord: function(gameId, word) {
                if (!this.db) return Promise.resolve();
                return new Promise((resolve) => {
                    const tx = this.db.transaction('state', 'readwrite');
                    const store = tx.objectStore('state');
                    const key = `${gameId}_used`;
                    const req = store.get(key);
                    req.onsuccess = () => {
                        const words = req.result ? req.result.words : [];
                        words.push(word);
                        store.put({ key, words });
                        resolve();
                    };
                });
            },
            clearAllData: function() {
                if (!this.db) return Promise.resolve();
                return new Promise((resolve) => {
                    const tx = this.db.transaction(['scores', 'state'], 'readwrite');
                    tx.objectStore('scores').clear();
                    tx.objectStore('state').clear();
                    tx.oncomplete = () => resolve();
                });
            }
        };

        // ==========================================
        // 3. UI COMPONENTS
        // ==========================================
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    window.lucide.createIcons({ icons: { [name]: window.lucide.icons[name] }, root: iconRef.current.parentNode });
                }
            }, [name]);
            return <i ref={iconRef} data-lucide={name} width={size} height={size} className={className}></i>;
        };

        const Button = ({ onClick, children, variant = "primary", className = "", disabled=false }) => {
            const baseStyle = "px-6 py-3 rounded-xl font-bold text-lg transition-transform active:scale-95 shadow-md flex items-center justify-center gap-2 no-tap-highlight select-none";
            const variants = {
                primary: "bg-indigo-600 text-white hover:bg-indigo-700",
                success: "bg-teal-600 text-white hover:bg-teal-700",
                danger: "bg-rose-500 text-white hover:bg-rose-600",
                outline: "border-2 border-indigo-600 text-indigo-700 hover:bg-indigo-50"
            };
            return (
                <button 
                    onClick={onClick} 
                    disabled={disabled}
                    className={`${baseStyle} ${variants[variant]} ${disabled ? 'opacity-50 cursor-not-allowed' : ''} ${className}`}
                >
                    {children}
                </button>
            );
        };

        const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return m > 0 ? `${m}m ${s}s` : `${s}s`;
        };

        const TopBar = ({ title, onBack, score, highScore, time, bestTime, moves, bestMoves }) => (
            <div className="bg-white shadow-sm p-4 flex justify-between items-center sticky top-0 z-10 rounded-b-2xl mb-4">
                <button onClick={onBack} className="p-2 rounded-full hover:bg-gray-100 text-gray-700">
                    <Icon name="ArrowLeft" size={28} />
                </button>
                <h1 className="text-2xl font-extrabold text-indigo-900 tracking-tight">{title}</h1>
                <div className="text-right">
                    {score !== undefined && <div className="text-lg font-bold text-teal-600">Score: {score}</div>}
                    {highScore !== undefined && <div className="text-sm font-semibold text-gray-500">Best: {highScore}</div>}
                    {time !== undefined && <div className="text-lg font-bold text-teal-600">Time: {formatTime(time)}</div>}
                    {bestTime !== undefined && bestTime !== null && <div className="text-sm font-semibold text-gray-500">Best: {formatTime(bestTime)}</div>}
                    {moves !== undefined && <div className="text-lg font-bold text-blue-600">Moves: {moves}</div>}
                    {bestMoves !== undefined && bestMoves !== null && <div className="text-sm font-semibold text-gray-500">Best: {bestMoves}</div>}
                </div>
            </div>
        );

        // ==========================================
        // 4. MODULES
        // ==========================================

        // --- MODULE: WORDLE ---
        const Wordle = ({ onBack }) => {
            const [solution, setSolution] = useState("");
            const [guesses, setGuesses] = useState([]);
            const [currentGuess, setCurrentGuess] = useState("");
            const [gameStatus, setGameStatus] = useState("playing"); 
            const [highScore, setHighScore] = useState(0);
            const [score, setScore] = useState(0);
            const [message, setMessage] = useState("");
            const inputRef = useRef(null);

            useEffect(() => {
                dbHelper.getHighScore('wordle').then(setHighScore);
                startNewGame();
            }, []);

            const startNewGame = async () => {
                const usedWords = await dbHelper.getUsedWords('wordle');
                let availableWords = WORDS_5_LETTER.filter(w => !usedWords.includes(w));
                if (availableWords.length === 0) availableWords = WORDS_5_LETTER;
                const randomWord = availableWords[Math.floor(Math.random() * availableWords.length)];
                setSolution(randomWord.toUpperCase());
                setGuesses([]);
                setCurrentGuess("");
                setGameStatus("playing");
                setMessage("");
                setTimeout(() => inputRef.current?.focus(), 100);
            };

            const processGuess = (guess) => {
                const newGuesses = [...guesses, guess];
                setGuesses(newGuesses);
                setCurrentGuess("");
                
                if (guess === solution) {
                    setGameStatus("won");
                    const newScore = score + (7 - newGuesses.length) * 10;
                    setScore(newScore);
                    dbHelper.saveScore('wordle', newScore);
                    dbHelper.addUsedWord('wordle', solution.toLowerCase());
                    setMessage("Brilliant!");
                } else if (newGuesses.length >= 6) {
                    setGameStatus("lost");
                    setMessage(solution);
                    setScore(0);
                }
            };

            const handleInputChange = (e) => {
                if (gameStatus !== "playing") return;
                const val = e.target.value.toUpperCase().replace(/[^A-Z]/g, '');
                
                if (val.length < 5) {
                    setCurrentGuess(val);
                } else if (val.length === 5) {
                    // Auto-submit instantly when 5 letters are entered
                    processGuess(val);
                }
            };

            const getLetterStyle = (letter, index, guess) => {
                if (!guess) return "bg-white border-2 border-gray-300 text-gray-800";
                
                // Logic for Wordle coloring
                const solArray = solution.split('');
                const guessArray = guess.split('');
                
                // 1. Exact match (Green)
                if (guessArray[index] === solArray[index]) return "bg-teal-500 border-teal-500 text-white";
                
                // 2. Count total occurrences of this letter in the solution
                const solCount = solArray.filter(c => c === letter).length;
                
                // 3. Count how many exact matches (greens) exist for this letter in the whole word
                const exactMatches = guessArray.filter((c, i) => c === letter && solArray[i] === letter).length;
                
                // 4. Count how many times this letter has been highlighted yellow BEFORE the current index
                let earlierYellows = 0;
                for (let i = 0; i < index; i++) {
                    if (guessArray[i] === letter && solArray[i] !== letter) {
                        earlierYellows++;
                    }
                }
                
                // 5. If there are still unmatched occurrences of this letter in the solution, it's yellow
                if (solCount - exactMatches - earlierYellows > 0) {
                    return "bg-amber-400 border-amber-400 text-white";
                }
                
                // Otherwise, it's incorrect (Gray)
                return "bg-gray-400 border-gray-400 text-white";
            };

            const rows = Array(6).fill(null);

            return (
                <div className="min-h-screen flex flex-col max-w-2xl mx-auto w-full pb-8">
                    <TopBar title="Wordle" onBack={onBack} score={score} highScore={highScore} />
                    
                    <div className="text-center text-gray-700 font-extrabold text-2xl mt-2 mb-6">
                        Guess the word
                    </div>

                    {message && (
                        <div className="text-center mb-4">
                            <span className="bg-gray-800 text-white px-4 py-2 rounded-lg font-bold text-lg shadow-md animate-pulse">
                                {message}
                            </span>
                        </div>
                    )}

                    <div className="flex-1 flex flex-col sm:flex-row items-center justify-center gap-4 sm:gap-8 w-full px-4">
                        <div className="flex sm:flex-col justify-center gap-3 sm:gap-6 text-xs sm:text-sm font-bold text-gray-600 sm:w-32 order-2 sm:order-1 mt-6 sm:mt-0 flex-shrink-0">
                            <div className="flex items-center gap-2"><div className="w-5 h-5 sm:w-6 sm:h-6 bg-teal-500 rounded border border-teal-600 flex-shrink-0"></div> Correct</div>
                            <div className="flex items-center gap-2"><div className="w-5 h-5 sm:w-6 sm:h-6 bg-amber-400 rounded border border-amber-500 flex-shrink-0"></div> Wrong Place</div>
                            <div className="flex items-center gap-2"><div className="w-5 h-5 sm:w-6 sm:h-6 bg-gray-400 rounded border border-gray-500 flex-shrink-0"></div> Incorrect</div>
                        </div>

                        <div className="relative flex flex-col gap-2 cursor-text order-1 sm:order-2 flex-shrink-0" onClick={() => inputRef.current?.focus()}>
                            {gameStatus === "playing" && (
                                <input ref={inputRef} type="text" value={currentGuess} autoFocus className="absolute opacity-0 w-full h-full inset-0 z-10 cursor-text" onChange={handleInputChange} aria-label="Hidden input for mobile keyboard" />
                            )}
                            {rows.map((_, i) => {
                                const guess = guesses[i] || (i === guesses.length ? currentGuess : "");
                                return (
                                    <div key={i} className="flex gap-2">
                                        {Array(5).fill(null).map((_, j) => {
                                            const letter = guess[j] || "";
                                            const isSubmitted = i < guesses.length;
                                            const style = isSubmitted ? getLetterStyle(letter, j, guess) : (letter ? "border-2 border-gray-600 text-gray-900 bg-white" : "border-2 border-gray-300 text-gray-900 bg-gray-50");
                                            return (
                                                <div key={j} className={`w-14 h-14 sm:w-16 sm:h-16 flex items-center justify-center text-2xl sm:text-3xl font-extrabold uppercase rounded-lg ${style} transition-all duration-300`}>
                                                    {letter}
                                                </div>
                                            );
                                        })}
                                    </div>
                                );
                            })}
                        </div>
                        <div className="hidden sm:block w-32 order-3 flex-shrink-0"></div>
                    </div>

                    {gameStatus !== "playing" && (
                        <div className="flex justify-center my-6">
                            <Button onClick={startNewGame} variant="success">Play Again</Button>
                        </div>
                    )}
                </div>
            );
        };

        // --- MODULE: WORD SEARCH ---
        const WordSearch = ({ onBack }) => {
            const GRID_SIZE = 10;
            const [grid, setGrid] = useState([]);
            const [wordsToFind, setWordsToFind] = useState([]);
            const [foundWords, setFoundWords] = useState([]);
            const [foundTiles, setFoundTiles] = useState([]);
            const [isDragging, setIsDragging] = useState(false);
            const [dragStart, setDragStart] = useState(null);
            const [dragCurrent, setDragCurrent] = useState(null);
            const [score, setScore] = useState(0);
            const [highScore, setHighScore] = useState(0);
            const [won, setWon] = useState(false);

            useEffect(() => {
                dbHelper.getHighScore('wordsearch').then(setHighScore);
                generateGame();
            }, []);

            const generateGame = async () => {
                const usedWords = await dbHelper.getUsedWords('wordsearch');
                let availableWords = ALL_WORDS.filter(w => w.length >= 4 && w.length <= 8 && !usedWords.includes(w));
                if (availableWords.length < 5) availableWords = ALL_WORDS.filter(w => w.length >= 4 && w.length <= 8);

                const selected = [];
                for(let i=0; i<5; i++) {
                    const w = availableWords.splice(Math.floor(Math.random() * availableWords.length), 1)[0];
                    if(w) selected.push(w.toUpperCase());
                }

                let newGrid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(''));
                const dirs = [[0,1], [1,0], [1,1]];

                selected.forEach(word => {
                    let placed = false;
                    let attempts = 0;
                    while (!placed && attempts < 100) {
                        const dir = dirs[Math.floor(Math.random() * dirs.length)];
                        const row = Math.floor(Math.random() * GRID_SIZE);
                        const col = Math.floor(Math.random() * GRID_SIZE);
                        
                        let canPlace = true;
                        for (let i = 0; i < word.length; i++) {
                            const r = row + (dir[0] * i);
                            const c = col + (dir[1] * i);
                            if (r >= GRID_SIZE || c >= GRID_SIZE || (newGrid[r][c] !== '' && newGrid[r][c] !== word[i])) { canPlace = false; break; }
                        }

                        if (canPlace) {
                            for (let i = 0; i < word.length; i++) newGrid[row + (dir[0] * i)][col + (dir[1] * i)] = word[i];
                            placed = true;
                        }
                        attempts++;
                    }
                });

                const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                for (let r=0; r<GRID_SIZE; r++) {
                    for (let c=0; c<GRID_SIZE; c++) {
                        if (newGrid[r][c] === '') newGrid[r][c] = alphabet[Math.floor(Math.random() * alphabet.length)];
                    }
                }

                setGrid(newGrid);
                setWordsToFind(selected);
                setFoundWords([]);
                setFoundTiles([]);
                setIsDragging(false);
                setDragStart(null);
                setDragCurrent(null);
                setWon(false);
            };

            const handlePointerDown = (r, c) => { if (won) return; setIsDragging(true); setDragStart({r, c}); setDragCurrent({r, c}); };
            const handlePointerMove = (e, r, c) => { if (!isDragging || won) return; setDragCurrent({r, c}); };
            const handleTouchMove = (e) => {
                if (!isDragging || won) return;
                const touch = e.touches[0];
                const elem = document.elementFromPoint(touch.clientX, touch.clientY);
                if (elem && elem.dataset.r && elem.dataset.c) setDragCurrent({ r: parseInt(elem.dataset.r), c: parseInt(elem.dataset.c) });
            };

            const handlePointerUp = () => {
                if (!isDragging || !dragStart || !dragCurrent) { setIsDragging(false); return; }
                const start = dragStart; const end = dragCurrent;
                const dr = end.r - start.r; const dc = end.c - start.c;
                
                if (dr !== 0 || dc !== 0) {
                    const isStraightLine = (dr === 0) || (dc === 0) || (Math.abs(dr) === Math.abs(dc));
                    if (isStraightLine) {
                        const steps = Math.max(Math.abs(dr), Math.abs(dc));
                        const stepR = dr === 0 ? 0 : dr / Math.abs(dr);
                        const stepC = dc === 0 ? 0 : dc / Math.abs(dc);
                        let wordFormed = ""; let path = [];
                        for (let i = 0; i <= steps; i++) {
                            const curR = start.r + (stepR * i); const curC = start.c + (stepC * i);
                            wordFormed += grid[curR][curC]; path.push({r: curR, c: curC});
                        }
                        let wordFormedRev = wordFormed.split('').reverse().join('');
                        if (wordsToFind.includes(wordFormed) && !foundWords.includes(wordFormed)) handleWordFound(wordFormed, path);
                        else if (wordsToFind.includes(wordFormedRev) && !foundWords.includes(wordFormedRev)) handleWordFound(wordFormedRev, path);
                    }
                }
                setIsDragging(false); setDragStart(null); setDragCurrent(null);
            };

            useEffect(() => {
                const handleGlobalUp = () => { if (isDragging) handlePointerUp(); };
                window.addEventListener('mouseup', handleGlobalUp);
                window.addEventListener('touchend', handleGlobalUp);
                return () => { window.removeEventListener('mouseup', handleGlobalUp); window.removeEventListener('touchend', handleGlobalUp); };
            }, [isDragging, dragStart, dragCurrent]);

            const getHighlightedTiles = () => {
                if (!isDragging || !dragStart || !dragCurrent) return [];
                const start = dragStart; const end = dragCurrent;
                const dr = end.r - start.r; const dc = end.c - start.c;
                const isStraightLine = (dr === 0) || (dc === 0) || (Math.abs(dr) === Math.abs(dc));
                if (!isStraightLine) return [{r: start.r, c: start.c}];
                const steps = Math.max(Math.abs(dr), Math.abs(dc));
                const stepR = dr === 0 ? 0 : dr / Math.abs(dr); const stepC = dc === 0 ? 0 : dc / Math.abs(dc);
                let highlighted = [];
                for (let i = 0; i <= steps; i++) highlighted.push({ r: start.r + (stepR * i), c: start.c + (stepC * i) });
                return highlighted;
            };

            const handleWordFound = (word, path) => {
                const newFound = [...foundWords, word];
                setFoundWords(newFound); setFoundTiles(prev => [...prev, ...path]);
                setScore(s => s + word.length * 10);
                if (newFound.length === wordsToFind.length) {
                    setWon(true);
                    const finalScore = score + (word.length * 10) + 100;
                    dbHelper.saveScore('wordsearch', finalScore); setScore(finalScore);
                    newFound.forEach(w => dbHelper.addUsedWord('wordsearch', w.toLowerCase()));
                }
            };

            const highlightedPath = getHighlightedTiles();
            const isTileHighlighted = (r, c) => highlightedPath.some(t => t.r === r && t.c === c);
            const isTileFound = (r, c) => foundTiles.some(t => t.r === r && t.c === c);

            return (
                <div className="min-h-screen flex flex-col max-w-lg mx-auto w-full touch-none select-none">
                    <TopBar title="Word Search" onBack={onBack} score={score} highScore={highScore} />
                    <div className="p-4 bg-white mx-4 rounded-xl shadow-sm mb-4">
                        <p className="text-gray-600 text-sm mb-2 font-medium">Find these words. Drag your finger across the letters.</p>
                        <div className="flex flex-wrap gap-2">
                            {wordsToFind.map(w => (
                                <span key={w} className={`px-3 py-1 rounded-full text-sm font-bold ${foundWords.includes(w) ? 'bg-teal-100 text-teal-700 line-through' : 'bg-gray-100 text-gray-800'}`}>
                                    {w}
                                </span>
                            ))}
                        </div>
                    </div>
                    <div className="flex-1 flex items-center justify-center p-2">
                        <div className="grid bg-indigo-900 p-2 rounded-xl gap-1 touch-none" style={{ gridTemplateColumns: `repeat(${GRID_SIZE}, minmax(0, 1fr))` }} onTouchMove={handleTouchMove}>
                            {grid.map((row, r) => (
                                row.map((letter, c) => {
                                    const highlighted = isTileHighlighted(r, c); const found = isTileFound(r, c);
                                    return (
                                        <div key={`${r}-${c}`} data-r={r} data-c={c} onPointerDown={() => handlePointerDown(r, c)} onPointerEnter={(e) => handlePointerMove(e, r, c)}
                                            className={`w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center text-xl font-bold rounded cursor-pointer no-tap-highlight transition-colors duration-200 ${highlighted ? 'bg-amber-400 text-white shadow-inner' : found ? 'bg-teal-200 text-teal-800' : 'bg-white text-indigo-900 hover:bg-indigo-50'}`}>
                                            {letter}
                                        </div>
                                    )
                                })
                            ))}
                        </div>
                    </div>
                    {won && (
                        <div className="p-6 text-center animate-pulse">
                            <h2 className="text-2xl font-black text-teal-600 mb-4">Excellent Job!</h2>
                            <Button onClick={generateGame} variant="primary" className="mx-auto">Play Next Puzzle</Button>
                        </div>
                    )}
                </div>
            );
        };

        // --- MODULE: WORD TOWER ---
        const WordTower = ({ onBack }) => {
            const COLS = 7;
            const ROWS = 9;
            const [grid, setGrid] = useState([]);
            const [selectedPath, setSelectedPath] = useState([]);
            const [isDragging, setIsDragging] = useState(false);
            const [score, setScore] = useState(0);
            const [highScore, setHighScore] = useState(0);
            const [message, setMessage] = useState("");

            useEffect(() => {
                dbHelper.getHighScore('wordtower').then(setHighScore);
                generateGrid();
            }, []);

            const generateGrid = () => {
                const vowels = "AEIOU"; const commonCons = "RSTLNCDG"; const allAlpha = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                let newGrid = [];
                for(let r=0; r<ROWS; r++){
                    let row = [];
                    for(let c=0; c<COLS; c++) {
                        const rand = Math.random(); let letter = "";
                        if (rand < 0.4) letter = vowels[Math.floor(Math.random()*vowels.length)];
                        else if (rand < 0.8) letter = commonCons[Math.floor(Math.random()*commonCons.length)];
                        else letter = allAlpha[Math.floor(Math.random()*allAlpha.length)];
                        row.push({ id: `${r}-${c}-${Date.now()}`, letter });
                    }
                    newGrid.push(row);
                }
                setGrid(newGrid); setSelectedPath([]); setIsDragging(false); setScore(0);
            };

            const handlePointerDown = (r, c) => { if (!grid[r][c]) return; setIsDragging(true); setSelectedPath([{r, c}]); };
            const handlePointerMove = (r, c) => {
                if (!isDragging || !grid[r][c]) return;
                const existingIndex = selectedPath.findIndex(p => p.r === r && p.c === c);
                if (existingIndex !== -1) { setSelectedPath(selectedPath.slice(0, existingIndex + 1)); return; }
                const last = selectedPath[selectedPath.length - 1];
                const rDiff = Math.abs(last.r - r); const cDiff = Math.abs(last.c - c);
                if (rDiff <= 1 && cDiff <= 1 && !(rDiff === 0 && cDiff === 0)) setSelectedPath(prev => [...prev, {r, c}]);
            };
            const handleTouchMove = (e) => {
                if (!isDragging) return;
                const touch = e.touches[0]; const elem = document.elementFromPoint(touch.clientX, touch.clientY);
                if (elem && elem.dataset.r && elem.dataset.c) handlePointerMove(parseInt(elem.dataset.r), parseInt(elem.dataset.c));
            };

            const handlePointerUp = () => {
                if (!isDragging) return;
                setIsDragging(false);
                if (selectedPath.length >= 3) submitWord(selectedPath); else setSelectedPath([]);
            };

            useEffect(() => {
                const handleGlobalUp = () => { if (isDragging) handlePointerUp(); };
                window.addEventListener('mouseup', handleGlobalUp); window.addEventListener('touchend', handleGlobalUp);
                return () => { window.removeEventListener('mouseup', handleGlobalUp); window.removeEventListener('touchend', handleGlobalUp); };
            }, [isDragging, selectedPath]);

            const submitWord = (path) => {
                const word = path.map(p => grid[p.r][p.c].letter).join('');
                if (VALIDATION_DICTIONARY.has(word.toLowerCase())) {
                    let pts = word.length * 10 * (word.length - 2);
                    const newScore = score + pts; setScore(newScore);
                    dbHelper.saveScore('wordtower', newScore); dbHelper.addUsedWord('wordtower', word.toLowerCase());
                    showMessage(`Awesome! +${pts} pts`);
                    
                    let newGrid = JSON.parse(JSON.stringify(grid));
                    path.forEach(p => { newGrid[p.r][p.c] = null; });
                    for (let c = 0; c < COLS; c++) {
                        let emptySpaces = 0;
                        for (let r = ROWS - 1; r >= 0; r--) {
                            if (newGrid[r][c] === null) emptySpaces++;
                            else if (emptySpaces > 0) { newGrid[r + emptySpaces][c] = newGrid[r][c]; newGrid[r][c] = null; }
                        }
                    }
                    setGrid(newGrid); setSelectedPath([]);
                } else { showMessage("Not a valid word."); setSelectedPath([]); }
            };

            const showMessage = (msg) => { setMessage(msg); setTimeout(() => setMessage(""), 2000); };
            const isSelected = (r, c) => selectedPath.some(p => p.r === r && p.c === c);
            const currentWord = selectedPath.map(p => grid[p.r][p.c]?.letter || "").join('');
            const isBoardEmpty = grid.length > 0 && grid.every(row => row.every(cell => cell === null));

            return (
                <div className="min-h-screen flex flex-col max-w-lg mx-auto w-full pb-6 touch-none select-none">
                    <TopBar title="Word Tower" onBack={onBack} score={score} highScore={highScore} />
                    <div className="px-4 mb-2 flex justify-between items-end h-16">
                        <div className="text-3xl font-black text-indigo-800 tracking-widest uppercase flex-1 text-center bg-indigo-50 rounded-xl py-2 shadow-inner border border-indigo-100 transition-all">
                            {currentWord || <span className="text-gray-300">_ _ _</span>}
                        </div>
                    </div>
                    {message && <div className="text-center text-rose-600 font-bold h-6">{message}</div>}
                    {!message && !isBoardEmpty && <div className="text-center text-gray-500 text-sm h-6">Drag to connect adjacent letters</div>}

                    {isBoardEmpty ? (
                        <div className="flex-1 flex flex-col items-center justify-center p-6 text-center animate-pulse mt-8">
                            <h2 className="text-3xl font-black text-teal-600 mb-6">Board Cleared!</h2>
                            <Button onClick={generateGrid} variant="primary">Play Next Board</Button>
                        </div>
                    ) : (
                        <div className="flex-1 flex flex-col items-center justify-center p-4">
                            <div className="grid gap-1 bg-gray-200 p-2 rounded-xl touch-none mb-6" style={{ gridTemplateColumns: `repeat(${COLS}, minmax(0, 1fr))` }} onTouchMove={handleTouchMove}>
                                {grid.map((row, r) => (
                                    row.map((cell, c) => {
                                        if (!cell) return <div key={`empty-${r}-${c}`} className="w-10 h-10 sm:w-12 sm:h-12 bg-transparent"></div>;
                                        const selected = isSelected(r, c);
                                        return (
                                            <div key={cell.id} data-r={r} data-c={c} onPointerDown={() => handlePointerDown(r, c)} onPointerEnter={() => handlePointerMove(r, c)}
                                                className={`w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center text-2xl font-bold rounded-lg cursor-pointer no-tap-highlight transition-all duration-200 shadow-sm ${selected ? 'bg-teal-500 text-white transform scale-95' : 'bg-white text-gray-800 hover:bg-teal-50'}`}>
                                                {cell.letter}
                                            </div>
                                        )
                                    })
                                ))}
                            </div>
                            <button onClick={generateGrid} className="text-sm font-bold text-indigo-600 hover:text-indigo-800 bg-indigo-50 px-4 py-2 rounded-lg flex items-center gap-2 transition-colors">
                                <Icon name="RefreshCw" size={16} /> New Board
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        // --- MODULE: JIGSAW ---
        const JigsawPuzzle = ({ onBack }) => {
            const [location, setLocation] = useState(null);
            const [board, setBoard] = useState(Array(9).fill(null));
            const [pool, setPool] = useState([]);
            const [selected, setSelected] = useState(null);
            const [time, setTime] = useState(0);
            const [bestTime, setBestTime] = useState(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [won, setWon] = useState(false);

            useEffect(() => { dbHelper.getBestTime('jigsaw').then(setBestTime); startNewGame(); }, []);

            useEffect(() => {
                let timer;
                if (isPlaying && !won) timer = setInterval(() => setTime(t => t + 1), 1000);
                return () => clearInterval(timer);
            }, [isPlaying, won]);

            const startNewGame = (resetTime = true) => {
                const randomSeed = Math.floor(Math.random() * 100000);
                setLocation({ name: `Mystery Scene #${randomSeed}`, url: `https://picsum.photos/seed/${randomSeed}/600/600` });
                let pieces = [0, 1, 2, 3, 4, 5, 6, 7, 8];
                for (let i = pieces.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pieces[i], pieces[j]] = [pieces[j], pieces[i]]; }
                setPool(pieces); setBoard(Array(9).fill(null)); setSelected(null);
                if (resetTime) setTime(0);
                setIsPlaying(true); setWon(false);
            };

            const handleSlotClick = (type, index) => {
                if (won) return;
                const clickedPieceId = type === 'board' ? board[index] : pool[index];
                const isLocked = type === 'board' && clickedPieceId === index;
                if (isLocked) return;

                if (!selected) {
                    if (clickedPieceId !== null) setSelected({ type, index });
                } else {
                    if (selected.type === type && selected.index === index) { setSelected(null); return; }
                    let newBoard = [...board]; let newPool = [...pool];
                    const sourcePieceId = selected.type === 'board' ? newBoard[selected.index] : newPool[selected.index];
                    const targetPieceId = type === 'board' ? newBoard[index] : newPool[index];
                    if (selected.type === 'board') newBoard[selected.index] = targetPieceId; else newPool[selected.index] = targetPieceId;
                    if (type === 'board') newBoard[index] = sourcePieceId; else newPool[index] = sourcePieceId;
                    setBoard(newBoard); setPool(newPool); setSelected(null);
                    if (newBoard.every((p, i) => p === i)) {
                        setWon(true); setIsPlaying(false); dbHelper.saveTime('jigsaw', time);
                        if (bestTime === null || time < bestTime) setBestTime(time);
                    }
                }
            };

            const renderPiece = (pieceId, isSelected, isLocked) => {

                const row = Math.floor(pieceId / 3); const col = pieceId % 3;
                return (
                    <div className={`w-full h-full rounded transition-transform relative overflow-hidden ${isSelected ? 'ring-4 ring-amber-500 scale-95 z-20' : isLocked ? 'z-10' : 'hover:scale-105 shadow-sm'}`}>
                        <div className="w-full h-full bg-gray-100" style={{ backgroundImage: `url(${location.url})`, backgroundSize: '300% 300%', backgroundPosition: `${col * 50}% ${row * 50}%` }}></div>
                        {isLocked && <div className="absolute inset-0 flex items-center justify-center bg-teal-500/40 ring-4 ring-teal-500 ring-inset"><Icon name="Check" size={40} className="text-white drop-shadow-lg opacity-100" /></div>}
                    </div>
                );
            };

            if (!location) return null;
            const allPiecesOnBoard = pool.every(p => p === null);
            const isWrong = allPiecesOnBoard && !won;

            return (
                <div className="min-h-screen flex flex-col max-w-lg mx-auto w-full pb-8 select-none touch-none">
                    <TopBar title="Mystery Jigsaw" onBack={onBack} time={time} bestTime={bestTime} />
                    <div className="flex flex-col items-center flex-1 px-4 gap-4">
                        <div className="flex items-center gap-4 bg-white p-3 rounded-xl shadow-sm border border-gray-100 w-full max-w-[320px]">
                            <img src={location.url} alt={location.name} className="w-16 h-16 rounded-lg object-cover shadow-sm border border-gray-200 bg-gray-100" />
                            <div>
                                <h2 className="text-lg font-bold text-gray-800 leading-tight flex items-center gap-2">
                                    Match the Scene
                                    {!won && <button onClick={() => startNewGame(false)} className="text-indigo-500 hover:text-indigo-700 active:scale-95 transition-all p-1 bg-indigo-50 rounded-full" title="Get a new image"><Icon name="RefreshCw" size={14} /></button>}
                                </h2>
                                <p className="text-xs text-gray-500 mt-1 font-medium">Rebuild the image above. Correct pieces will lock into place.</p>
                            </div>
                        </div>
                        {isWrong && <div className="text-amber-700 font-bold text-sm bg-amber-50 px-4 py-2 rounded-lg border border-amber-200 animate-pulse text-center w-full max-w-[320px]">Pieces placed, but some are wrong. Keep swapping!</div>}
                        <div className="w-full max-w-[320px] aspect-square rounded-xl bg-gray-200 shadow-inner p-1 grid grid-cols-3 grid-rows-3 gap-1 relative overflow-hidden">
                            {board.map((pieceId, i) => {
                                const isSelected = selected?.type === 'board' && selected?.index === i; const isLocked = pieceId === i;
                                return <div key={`board-${i}`} className={`relative z-10 bg-white/40 rounded cursor-pointer ${!won && pieceId === null && selected ? 'ring-2 ring-indigo-300 ring-inset' : ''}`} onClick={() => handleSlotClick('board', i)}>{renderPiece(pieceId, isSelected, isLocked)}</div>
                            })}
                            {won && <div className="absolute inset-0 z-20 tile-pop rounded-xl" style={{ backgroundImage: `url(${location.url})`, backgroundSize: 'cover', backgroundPosition: 'center' }}></div>}

                                <div className="flex flex-wrap gap-2 justify-center">
